[project]
name = "mbaara-mms-tts"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
	"fastapi>=0.111.0",
	"uvicorn[standard]>=0.30.0",
	"transformers>=4.40.0,<5.0.0",
	"accelerate>=0.29.0",
	"torch==2.2.2+cpu",
	"soundfile>=0.12.1",
	"numpy>=1.24.0,<2.0.0",
	"huggingface-hub>=0.23.0",
]

[tool.vercel]
entrypoint = "tts_api:app"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }